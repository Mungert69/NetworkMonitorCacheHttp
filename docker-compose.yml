
services:
  networkmonitorcachehttp:
    image: mungert/networkmonitorcachehttp:1.0.1
    ports:
      - "5000:5000"
    env_file:
      - ${FILES_DIR}/domain-env
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=False
      - CACHE_DIR=/app/cache_files
      - MAX_FILE_SIZE=5242880000  # 5000MB in bytes
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=*
    volumes:
      - ~/cache-ir:/app/cache_files
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Add Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # For SSL certificates
    depends_on:
      - networkmonitorcachehttp
    restart: unless-stopped
    profiles:
      - production  # Use with: docker-compose --profile production up

networks:
  default:
    name: cache-network
